<script>
  fetch('/posts.json')
    .then(response => response.json())
    .then(data => {
      // Lọc ra đúng bài viết thuộc danh mục 'tu-bep'
      const posts = data.filter(item => item.category === 'tu-bep');
      
      const container = document.getElementById('project-list');
      container.innerHTML = posts.map(post => `
        <div class="card">
          <div class="card-meta">${post.date} • ${post.location}</div>
          <h3 class="card-title">${post.title}</h3>
          <p class="card-desc">${post.desc}</p>
          <a href="${post.url}" class="btn-read">ĐỌC TIẾP</a>
        </div>
      `).join('');
    })
    .catch(err => console.error('Lỗi tải danh sách bài viết:', err));
</script>
